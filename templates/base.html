<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Daybook{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<style>
:root{--ink:#203b35;--paper:#f6f7f2}body{background:var(--paper);color:var(--ink);font-family:system-ui,sans-serif}.navbar{padding:1.1rem 0;background:#203b35!important}.navbar-brand{font-family:Georgia,serif;font-size:1.8rem}.container{max-width:1000px}h1{font-family:Georgia,serif;font-size:clamp(2.2rem,5vw,3.6rem);letter-spacing:-.04em}.btn-primary{background:#245848;border-color:#245848}.list-group{gap:12px}.list-group-item{border:1px solid #dce3da!important;border-radius:16px!important;padding:22px;background:#fff}.badge{color:#25372c}.card{border-radius:18px;border-color:#dce3da;box-shadow:0 14px 35px #203b3508}.form-control,.form-select{border-radius:10px;padding:12px}.btn{border-radius:9px}.list-group-item h5{overflow-wrap:anywhere}.task-actions{display:flex;gap:8px;flex-shrink:0}@media(max-width:600px){.list-group-item>.d-flex{align-items:flex-start!important;gap:15px;flex-direction:column}.navbar-collapse{display:block!important}.navbar-toggler{display:none}.navbar-nav{flex-direction:row;gap:20px}}
</style></head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="{% url 'todo_list' %}">Daybook</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    {% if user.is_authenticated %}
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'todo_create' %}">Add Todo</a>
                        </li>
                        <li class="nav-item">
                            <form method="post" action="{% url 'logout' %}">
                                {% csrf_token %}
                                <button type="submit" class="nav-link btn btn-link" style="border:none; background:none;">Logout</button>
                            </form>
                        </li>
                    {% else %}
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'login' %}">Login</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'signup' %}">Sign Up</a>
                        </li>
                    {% endif %}
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endif %}

        {% block content %}
        {% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
